name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/GetItDone-app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetItDone-Android-APK
          path: output/GetItDone-app-debug.apk
          if-no-files-found: error
          retention-days: 30
